# Fly.io configuration for the PUBLIC DEMO of BewerbungsPilot (docs/deployment.md).
# One small machine with one volume; demo mode only. No secrets are needed.

app = "bewerbungspilot"        # must match the app created with "fly apps create"
primary_region = "fra"         # Frankfurt

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Demo__Enabled = "true"
  Storage__DataDirectory = "/data/demo"
  AllowedHosts = "bewerbungspilot.fly.dev"
  # Fly's proxy terminates HTTPS on port 443 and forwards plain HTTP to port 8080.
  ASPNETCORE_HTTPS_PORT = "443"
  ReverseProxy__TrustAllProxies = "true"       # port 8080 is reachable only through Fly's proxy
  ReverseProxy__ClientIpHeader = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # stops when idle (cost), starts again on the next request
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    [http_service.checks.headers]
      Host = "bewerbungspilot.fly.dev"
      X-Forwarded-Proto = "https"

[mounts]
  source = "bewerbungspilot_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "on-failure"
  retries = 5
