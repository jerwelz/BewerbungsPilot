name: Deploy demo (Fly.io)

# Manual only: Actions → "Deploy demo (Fly.io)" → "Run workflow". Never runs on push.
# Builds from a clean checkout of the repository, so the personal storage/ folder cannot exist here.
# Needs the repository secret FLY_API_TOKEN (a deploy token, see docs/deployment.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check the public URL
        run: |
          for i in $(seq 1 30); do
            curl --silent --fail https://bewerbungspilot.fly.dev/health && exit 0
            sleep 2
          done
          exit 1
